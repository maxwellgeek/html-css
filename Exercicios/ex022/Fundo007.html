<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #conteiner {
            background-color: blueviolet;
            background-size: 100% 100%;
            height: 96vh;
            padding: 10px;
            position: relative;
        }

        #conteudo {
            background-color: aquamarine;
            background-size: 100% 100%;
            height: 500px;
            width: 300px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);

            
        }
    </style>
</head>
<body>
    <section id="conteiner">
        <article id="conteudo">

        </article>
    </section>   
</body>
</html>
