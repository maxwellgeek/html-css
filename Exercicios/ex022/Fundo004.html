<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style>
       div.logo {
            border-radius: 20px;
            background-image: url('imagens/Logo-roku.png');
       }

       div#b1 {
            background-position: left top;
       }

        div#b2 {
            background-position: top center;
       }

        div#b3 {
            background-position: right top;
       }

        div#b4 {
            background-position: left center;
       }

        div#b5 {
            background-position: center center;
       }

        div#b6 {
            background-position: center right;
       }

        div#b7 {
            background-position: bottom left;
       }

        div#b8 {
            background-position: bottom center;
       }

        div#b9 {
            background-position: bottom right;
       }         
            
            
      
    </style>
</head>
<body>
    <div class="logo" id="b1">

    </div>

    <div class="logo" id="b2">

    </div>

    <div class="logo" id="b3">

    </div>

    <div class="logo" id="b4">

    </div>

    <div class="logo" id="b5">

    </div>

    <div class="logo" id="b6">

    </div>

    <div class="logo" id="b7">

    </div>

    <div class="logo" id="b8">

    </div>

    <div class="logo" id="b9">

    </div>
</body>
</html>
